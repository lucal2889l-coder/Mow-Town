<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mow Town</title>
<style>
/* =====================================================================
   STYLES — "summer job" art style: dark glass panels, grass-green + cash-gold
   ===================================================================== */
:root{
  --panel:rgba(14,22,17,.94);--panel2:rgba(30,45,35,.97);--line:rgba(255,255,255,.1);
  --acc:#9be84a;--acc-d:#5fa61c;--gold:#ffcf4a;--cash:#7be08a;--txt:#f2f6ef;--mut:#9fb2a4;--bad:#ff6a5a;--sky:#7ed4ff;
  --r:16px;--sh:0 12px 34px rgba(0,0,0,.5);
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --display:"Arial Black","Segoe UI Black","Segoe UI",Impact,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b140e;font-family:var(--font);color:var(--txt);user-select:none;-webkit-user-select:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.32) 100%)}
#fade{position:fixed;inset:0;pointer-events:none;background:#000;opacity:0;transition:opacity .5s}
#ui{position:fixed;inset:0;pointer-events:none}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:none;pointer-events:auto}
.screen.on{display:flex}
.center{align-items:center;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.btn{background:var(--panel2);border:2px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 15px;font-weight:800;font-size:14px;transition:transform .08s,background .15s,border-color .15s;display:inline-flex;align-items:center;gap:7px;justify-content:center;position:relative}
.btn:hover{background:#34503c;border-color:rgba(155,232,74,.35)}
.btn:active{transform:scale(.97)}
.btn:focus{outline:none}
.btn:focus-visible,.btn.kbd:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(155,232,74,.35)}
.btn.primary{background:linear-gradient(180deg,#b6f56a,#74c427);color:#10200a;border-color:#d8ff9c;font-size:18px;padding:13px 20px;box-shadow:0 5px 0 #4a8410}
.btn.primary:hover{background:linear-gradient(180deg,#c6ff80,#84d42f)}
.btn.gold{background:linear-gradient(180deg,#ffe07a,#f0b41c);color:#2a1a00;border-color:#fff0b0}
.btn.sel{border-color:var(--acc);background:#3a5a28}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn .badge{position:absolute;top:-7px;right:-7px;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:2px 6px;font-weight:900}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.muted{color:var(--mut)}
.cash{color:var(--cash);font-weight:900}
h1,h2,h3{font-family:var(--display);letter-spacing:.4px}
.row{display:flex;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#4a6a52 transparent}
.pbar{height:9px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc-d),var(--acc));border-radius:6px;transition:width .3s}
kbd{font-family:var(--font);font-size:11px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:5px;padding:1px 6px;font-weight:800}
.lbl{font-size:12px;font-weight:900;letter-spacing:1.4px;color:var(--mut);text-transform:uppercase}
.small{font-size:12px;font-weight:700}

/* ---------------- HUD ---------------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hudTL{position:absolute;top:14px;left:16px;display:flex;flex-direction:column;gap:6px}
.chip{background:rgba(8,14,10,.72);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:6px 12px;font-weight:900;display:inline-flex;align-items:center;gap:8px;width:max-content}
#money{font-family:var(--display);font-size:22px;color:var(--cash)}
#money.bump{animation:bump .3s}
#clock{font-size:14px}
#minimapWrap{position:absolute;top:14px;right:14px;width:190px;height:190px;border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,.2);box-shadow:var(--sh);background:#2b4a24}
#minimap{width:100%;height:100%;display:block}
#jobPanel{position:absolute;top:214px;right:14px;width:230px;padding:10px 12px;display:none}
#jobPanel h4{font-size:14px;margin-bottom:2px}
#jobPanel .jp{margin-top:7px;font-size:12px;font-weight:800}
#jobPanel .jp .row{justify-content:space-between}
#jobPanel .jp.done .pbar>i{background:linear-gradient(90deg,#3fb6ff,var(--sky))}
#vehHud{position:absolute;left:16px;bottom:16px;padding:10px 12px;min-width:210px;display:none}
#vehHud .row{justify-content:space-between;font-size:12px;font-weight:800}
#fuelBar{height:10px;margin:5px 0 7px}
#fuelBar.low>i{background:var(--bad);animation:blink .6s infinite}
#blades{font-weight:900;font-size:12px;padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.1)}
#blades.on{background:#3a5a28;color:var(--acc)}
#prompt{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(8,14,10,.82);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 14px;font-weight:800;font-size:15px;display:none;white-space:nowrap}
#prompt kbd{font-size:14px;padding:2px 8px;background:var(--acc);color:#10200a;border:none}
#hintLine{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:12px;font-weight:700;opacity:.8;text-shadow:0 1px 3px #000;white-space:nowrap}
#toasts{position:absolute;top:96px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:7px;align-items:center}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:var(--sh);animation:toastIn .3s ease-out,toastOut .4s ease-in 3.4s forwards;max-width:420px;text-align:center}
.toast small{display:block;color:var(--mut);font-weight:600}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--display);font-size:40px;pointer-events:none;opacity:0;text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 24px rgba(0,0,0,.35)}
#banner.go{animation:fadeStamp 2s ease-out forwards}
#banner small{display:block;font-size:18px;font-family:var(--font);font-weight:800;color:var(--gold)}
#receipt{position:absolute;right:14px;bottom:16px;width:280px;padding:14px 16px;display:none;animation:popIn .35s cubic-bezier(.2,1.5,.4,1)}
#receipt h3{font-size:16px;margin-bottom:6px}
#receipt .ln{display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin:3px 0}
#receipt .tot{border-top:1px dashed rgba(255,255,255,.25);padding-top:6px;margin-top:6px;font-size:16px}
.stars{color:var(--gold);font-size:20px;letter-spacing:2px}
#dialog{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:min(560px,94vw);padding:14px 18px;display:none;pointer-events:auto}
#dialog .who{font-family:var(--display);font-size:15px;color:var(--gold);margin-bottom:4px}
#dialog .say{font-size:15px;font-weight:600;line-height:1.45;margin-bottom:10px}
#dialog .opts{display:flex;gap:8px;flex-wrap:wrap}
#crosshair{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;display:none;background:linear-gradient(#fff,#fff) center/2px 18px no-repeat,linear-gradient(#fff,#fff) center/18px 2px no-repeat;filter:drop-shadow(0 0 2px #000);opacity:.85}

/* ---------------- Screens ---------------- */
#scr-title{align-items:center;justify-content:center;flex-direction:column;gap:10px;background:radial-gradient(ellipse at center,rgba(0,0,0,.05),rgba(0,0,0,.6))}
.logo{font-family:var(--display);font-size:clamp(46px,8vw,96px);line-height:.92;text-align:center;
  background:repeating-linear-gradient(90deg,#b9f56c 0 24px,#86cf3a 24px 48px);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 #2b4a10) drop-shadow(0 14px 22px rgba(0,0,0,.6))}
.tagline{font-weight:900;letter-spacing:6px;font-size:15px;text-shadow:0 2px 6px #000;margin-bottom:18px}
.titleBtns{display:flex;flex-direction:column;gap:10px;width:min(310px,92vw)}
.dlg{width:min(780px,95vw);max-height:92vh;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.dlgHead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dlgHead h2{font-size:24px}
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.tabs .btn{padding:7px 10px;font-size:13px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opts .btn{padding:8px 11px;font-size:13px}
.swatch{width:38px;height:38px;border-radius:10px;padding:0;border:3px solid rgba(255,255,255,.15)}
.swatch.sel{border-color:#fff;box-shadow:0 0 0 3px var(--acc)}
.swatch.lock{opacity:.3}
.card{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:12px;align-items:center}
.card.sel{border-color:var(--acc)}
.card .ic{font-size:28px;width:38px;text-align:center}
.card .t{flex:1}
.card h4{font-size:14px}
.card small{color:var(--mut);font-weight:600;display:block;margin-top:2px}
/* phone */
#scr-phone{align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
.phone{width:min(430px,94vw);height:min(720px,94vh);border-radius:34px;background:#0d1410;border:7px solid #1d2622;box-shadow:0 20px 60px rgba(0,0,0,.7),inset 0 0 0 2px #2e3a33;display:flex;flex-direction:column;overflow:hidden}
.phTop{display:flex;justify-content:space-between;padding:12px 20px 6px;font-size:12px;font-weight:900}
.phHead{display:flex;align-items:center;gap:8px;padding:6px 14px 10px}
.phHead h3{flex:1;font-size:18px}
.phBody{flex:1;overflow-y:auto;padding:4px 14px 14px;display:flex;flex-direction:column;gap:9px;scrollbar-width:thin;scrollbar-color:#4a6a52 transparent}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:14px 6px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:10px 4px;border-radius:16px}
.app i{font-style:normal;font-size:30px;width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.phNav{display:flex;justify-content:center;padding:8px}
#mapCanvas{width:100%;border-radius:12px;background:#2b4a24;cursor:crosshair}
.pass{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.tier{flex:none;width:86px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);padding:8px 6px;text-align:center;font-size:11px;font-weight:800}
.tier .ti{font-size:26px;height:34px;line-height:34px}
.tier.got{border-color:var(--acc);background:#2c4a22}
.tier.cur{border-color:var(--gold);box-shadow:0 0 14px rgba(255,207,74,.4)}
.tier.legend{background:linear-gradient(160deg,#5a4a10,#2a2410);border-color:var(--gold)}
.tier .tn{color:var(--mut);font-size:10px}
.story{background:linear-gradient(135deg,rgba(126,212,255,.1),rgba(155,232,74,.06));border:1px solid rgba(126,212,255,.3);border-radius:14px;padding:11px 13px}
.story h4{color:var(--sky);font-size:12px;letter-spacing:1.3px;margin-bottom:4px}
.story p{font-style:italic;font-size:14px;margin-bottom:6px}
.story.done{opacity:.55}
/* workbench */
#scr-bench{justify-content:flex-end}
.bpanel{width:min(620px,100vw);margin:10px;height:calc(100vh - 20px);overflow:hidden;display:grid;grid-template-columns:78px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
.gHead{grid-column:1/3;display:flex;gap:12px;align-items:center;padding:10px 12px;background:linear-gradient(120deg,#2c4a2e,#16241a);border-bottom:1px solid var(--line)}
.gHead img{width:96px;aspect-ratio:16/10;border-radius:10px;object-fit:cover;flex:none;border:2px solid rgba(255,255,255,.15)}
.gWho{flex:1;min-width:0}.gWho h2{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gStats{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;font-weight:800;color:#d6e6d8;margin-top:3px}
.gTop{display:flex;flex-direction:column;align-items:flex-end;gap:6px}.gTop .btn{padding:4px 10px}.gTop .chip{font-size:14px;padding:3px 9px}
.gRail{display:flex;flex-direction:column;gap:3px;padding:7px 5px;background:rgba(0,0,0,.28);overflow-y:auto;scrollbar-width:none}
.gTab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border-radius:11px;font-size:11px;font-weight:800;color:var(--mut);transition:background .12s}
.gTab i{font-style:normal;font-size:21px;line-height:1.1}.gTab:hover{background:rgba(255,255,255,.08);color:var(--txt)}
.gTab.sel{background:#34553a;color:#fff;box-shadow:inset 3px 0 0 var(--acc)}.gTab:focus-visible,.gTile:focus-visible,.pTile:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.bbody{overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:11px 12px}
.gFoot{grid-column:1/3;text-align:center;font-size:11px;font-weight:700;color:var(--mut);padding:5px;border-top:1px solid var(--line)}
.gTitle{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}.gTitle h3{font-size:19px}.gTitle small{color:var(--mut);font-weight:700;font-size:12px}
.gGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:7px}
.gTile{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:54px;padding:7px 10px;text-align:left;font-size:13px;line-height:1.2;background:var(--panel2);border:2px solid var(--line);border-radius:12px;transition:border-color .12s,background .12s}
.gTile:hover{border-color:rgba(155,232,74,.5);background:#2f4635}.gTile.sel{border-color:var(--acc);background:#2f4a2a}.gTile.sel::after{content:'✔';position:absolute;top:5px;right:8px;color:var(--acc);font-weight:900}
.gTile.lock b{color:#c2cfc5}.gTile .gIc{font-style:normal;font-size:18px}.gDot{display:block;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.gSub{font-size:11px;font-weight:800;color:var(--mut)}.gSub.use{color:var(--acc)}.gSub.price{color:var(--cash)}.gSub.poor{color:var(--bad)}.gSub.how{color:var(--gold)}
.pGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.pTile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 3px;border-radius:11px;border:2px solid transparent;background:rgba(255,255,255,.04);font-size:10px;line-height:1.15;text-align:center}
.pTile:hover{background:rgba(255,255,255,.1)}.pTile.sel{border-color:var(--acc);background:#2f4a2a}.pTile b{font-weight:800}
.pTile i{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.3);font-style:normal;font-size:13px}.pTile.lock i{opacity:.55}
.gNote{background:rgba(255,207,74,.1);border:1px solid rgba(255,207,74,.35);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700}
.gMowers{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.gMower{display:flex;flex-direction:column;gap:4px;background:var(--panel2);border:2px solid var(--line);border-radius:13px;padding:7px;font-size:13px}.gMower.sel{border-color:var(--acc)}
.gMower img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:9px;display:block}.gMower small{color:var(--mut);font-weight:700;font-size:11px;flex:1}
.gLinks{display:flex;flex-direction:column;gap:6px;margin-top:3px}
/* recommendations + update log */
.titleExtra{display:flex;gap:7px}.titleExtra .btn{flex:1;padding:8px 6px;font-size:12px;white-space:nowrap}
.btn .newTag{position:absolute;top:-8px;right:-6px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:1px 6px;font-weight:900}
textarea.inp{resize:none;min-height:112px;line-height:1.4;display:block}.inp{user-select:text;-webkit-user-select:text}
.ideaT{display:flex;gap:6px;flex-wrap:wrap}.ideaT .btn{padding:7px 12px;font-size:13px}
.ideaC{float:right;font-weight:700;letter-spacing:0;text-transform:none}
.logV{background:var(--panel2);border:2px solid var(--line);border-radius:13px;padding:10px 13px}.logV.now{border-color:var(--acc)}
.logV h4{font-size:15px;margin:2px 0 5px}.logV .lv{font-family:var(--display);font-size:12px;color:var(--gold)}.logV .ld{color:var(--mut);font-size:11px;font-weight:700;margin-left:6px}
.logV ul{list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:600;line-height:1.35}.logV li::before{content:'＋ ';color:var(--acc);font-weight:900}
@media (max-width:640px){.bpanel{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto}.gHead,.gFoot{grid-column:1}.gRail{flex-direction:row;overflow-x:auto}.gTab{min-width:60px}}
#livery{width:100%;aspect-ratio:2/1;border-radius:10px;background:#000;cursor:crosshair;touch-action:none;outline:2px solid rgba(255,255,255,.15)}
#livery:focus{outline:2px solid var(--acc)}
.stkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.stkgrid .btn{padding:3px;height:48px}
.stkgrid img{width:38px;height:38px;pointer-events:none}
.stkgrid .btn.lock{opacity:.28}
.setRow{display:flex;align-items:center;gap:12px;background:var(--panel2);border-radius:12px;padding:9px 12px}
.setRow label{flex:1;font-weight:800;font-size:14px}
.setRow input[type=range]{width:170px;accent-color:var(--acc)}
.statsT{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.statsT b{text-align:right}
@keyframes bump{40%{transform:scale(1.25)}}
@keyframes blink{50%{opacity:.35}}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}
@keyframes popIn{from{opacity:0;transform:scale(.7)}}
@keyframes fadeStamp{0%{opacity:0;transform:scale(1.3)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
#banner .big{display:block;font-size:84px;line-height:1;background:linear-gradient(180deg,#fff6c8,#ffcf4a 55%,#e08a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #6a3a00) drop-shadow(0 0 24px rgba(255,207,74,.7))}
/* lawn progress bar (PowerWash-style, top centre) */
#yardBar{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:min(440px,56vw);display:none;text-align:center}
#yardBar .yt{display:flex;justify-content:space-between;align-items:flex-end;font-weight:900;font-size:13px;text-shadow:0 1px 3px #000;margin-bottom:4px}
#yardBar .yp{font-family:var(--display);font-size:24px;line-height:1}
#yardBar .bar{height:18px;border-radius:10px;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.28);overflow:hidden;position:relative}
#yardBar .fill{height:100%;width:0;background:repeating-linear-gradient(90deg,#74c832 0 14px,#98e64c 14px 28px);box-shadow:0 0 14px rgba(155,232,74,.6);transition:width .15s linear}
#yardBar .bar::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 60%)}
#yardBar .tk{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.45)}
#yardBar.pulse .bar{animation:barPulse .55s}
#yardBar.pulse .yp{animation:bump .4s}
#yardBar.done .fill{background:linear-gradient(90deg,#ffcf4a,#fff3b0,#ffcf4a,#ffcf4a);background-size:200% 100%;animation:shine 1s linear infinite;box-shadow:0 0 22px rgba(255,207,74,.9)}
#yardBar.done .yp{color:var(--gold)}
@keyframes barPulse{30%{transform:scale(1.06);box-shadow:0 0 28px rgba(155,232,74,.95)}}
@keyframes shine{to{background-position:-200% 0}}
#ftLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ft{position:absolute;font-family:var(--display);white-space:nowrap;transform:translate(-50%,-50%);animation:ftUp 1.2s ease-out forwards;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 10px rgba(0,0,0,.4)}
@keyframes ftUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.2)}30%{transform:translate(-50%,-80%) scale(1)}100%{opacity:0;transform:translate(-50%,-200%) scale(.95)}}
.cashfly{position:absolute;font-size:24px;transition:left .7s cubic-bezier(.5,-.3,.7,1),top .7s cubic-bezier(.3,0,.7,1.3),opacity .7s,transform .7s;pointer-events:none}

const STICKERS = [];
function stk(id, name, draw, pass) { STICKERS.push({ id, name, draw, pass }); }
function emo(id, ch, pass) { STICKERS.push({ id, name: ch, emoji: ch, pass }); }
function starPath(c, x, y, n, R, r) { c.beginPath(); for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r : R; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } c.closePath(); }
function poly(c, pts) { c.beginPath(); for (let i = 0; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); }
function outline(c, w = 6, col = '#141414') { c.lineWidth = w; c.lineJoin = 'round'; c.strokeStyle = col; c.stroke(); }
function txt(c, s, size, fill, stroke, y = 64, italic = true) {
  c.font = (italic ? 'italic ' : '') + '900 ' + size + 'px "Arial Black","Segoe UI Black",Impact,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const w = c.measureText(s).width; if (w > 120) c.font = c.font.replace(size + 'px', Math.floor(size * 120 / w) + 'px');
  c.lineWidth = 8; c.lineJoin = 'round'; c.strokeStyle = stroke; c.strokeText(s, 64, y); c.fillStyle = fill; c.fillText(s, 64, y);
}
function roundel(num, bg = '#fff', fg = '#111') { return c => { c.beginPath(); c.arc(64, 64, 54, 0, 7); c.fillStyle = bg; c.fill(); outline(c, 8); c.font = '900 ' + (num.length > 1 ? 58 : 70) + 'px "Arial Black",Impact,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = fg; c.fillText(num, 64, 68); }; }

function packYards(only) {
  const out = {};
  for (const Y of Yards.list) {
    if (only && !only(Y)) continue;
    const n = Y.nx * Y.nz, b = new Uint8Array(n), d = Y.data;
    for (let i = 0; i < n; i++) b[i] = (d[i * 4] >> 4) << 4 | (d[i * 4 + 1] >> 4);
    let s = ''; for (let i = 0; i < n; i += 8192) s += String.fromCharCode.apply(null, b.subarray(i, i + 8192));
    out[Y.id] = btoa(s);

  if (!o) return false;
  for (const Y of Yards.list) {
    const s = o[Y.id]; if (!s) continue; let bin; try { bin = atob(s); } catch (e) { continue; }
    const n = Y.nx * Y.nz; if (bin.length !== n) continue; // saved before this lawn changed size: it just starts fresh
    for (let i = 0; i < n; i++) { const v = bin.charCodeAt(i); Y.data[i * 4] = ((v >> 4) * 17); Y.data[i * 4 + 1] = (v & 15) * 17; }

function findInteractions() {

  for (const it of Town.interact.concat(Interior.items)) {

    if (it.kind === 'stall') consider(d, { label: 'Ray\'s Upgrade Stall — buy upgrades', act: () => openMenu('stall') });
    if (it.kind === 'pump') {

      if (md < 6.5 && need > 0.05) consider(d, { label: `Refuel ${M.def.name.split(' ')[0]} (${need.toFixed(1)} L · ${money(Math.max(1, need * GAS_PRICE))})`, act: () => startPump('mower') });

    }

  }

const Menu = { cur: null, from: 'play', confirm: null, just: null };
function openMenu(name) {
  if (Game.state === 'menu' && Menu.cur === name) { closeMenu(); return; }
  if (!['play', 'menu', 'bench', 'title', 'paused'].includes(Game.state)) return;
  if (Race.on && !['pass', 'ideas', 'log'].includes(name)) { Sfx.error(); toast('Not during a race', 'Finish or quit the race first.', 'var(--gold)'); return; }
  if (Game.dialog) closeDialog();
  if (Game.state !== 'menu') Menu.from = Game.state; else if (Menu.cur === 'jobs') markJobsSeen();
  if (name === 'stall') hideAffordPop();
  unlockMouse(); Game.state = 'menu'; Menu.cur = name; Menu.confirm = null; Menu.just = null; Game.keys = {};
  renderMenu(); showScreen('menu'); Sfx.phone(); tutEvent(name);
}
function markJobsSeen() { S.jobs.list.forEach(j => S.jobsSeen[j.id] = 1); }
function closeMenu() {
  if (Menu.cur === 'jobs') markJobsSeen(); // jobs you've looked at stop being "new"
  Menu.cur = null; Menu.confirm = null; save();
  if (Menu.from === 'bench') { Game.state = 'bench'; renderBench(); showScreen('bench'); return; }
  if (Menu.from === 'title') { showTitle(); return; }
  if (Menu.from === 'paused') { Game.state = 'play'; pauseGame(); return; }
  Game.state = 'play'; showScreen(null); lockMouse();
}
function refreshOpenUI() { if (Game.state === 'menu') renderMenu(); else if (Game.state === 'bench') renderBench(); }
function renderMenu() {
  const c = Menu.cur, el = $('#scr-menu'), sy = el.querySelector('.mbody') ? el.querySelector('.mbody').scrollTop : 0;
  el.innerHTML = c === 'jobs' ? jobsHTML() : c === 'event' ? eventHTML() : c === 'ideas' ? ideasHTML() : c === 'log' ? logHTML() : c === 'quests' ? questsHTML() : c === 'shop' ? shopHTML() : c === 'stall' ? stallHTML() : c === 'pass' ? passHTML() : c === 'tutw' ? tutWelcomeHTML() : '';
  const mb = el.querySelector('.mbody'); if (mb) mb.scrollTop = sy;
  if (c === 'pass') { const row = $('#passRow'), cur = row && row.querySelector('.cur'); if (cur) row.scrollLeft = cur.offsetLeft - 160; }
